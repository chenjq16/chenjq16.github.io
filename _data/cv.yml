    Projects:
      - name: Pedestrian Navigation
        summary: Engineering Research Center for Navigation Technology, Department of Precision Instrument, Tsinghua University
        highlights:
          - Developed an embedded system for pedestrian navigation
          - Developed pedestrian motion-state recognition algorithms
          - Established a pedestrian motion-state database
        start_date: 2020-03
        end_date: 2023-08

      - name: Microsphere Cleaning Device for Biological Detection
        summary: School of Medicine, Tsinghua University
        highlights:
          - Simulated fluid flow in the cleaning device using COMSOL
          - Developed control software for the cleaning device
        start_date: 2018-11
        end_date: 2019-03

